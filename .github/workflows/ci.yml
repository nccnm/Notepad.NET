name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore NotepadNet.slnx

      - name: Build (warnings are errors)
        run: dotnet build NotepadNet.slnx -c Release --no-restore

      - name: Core tests with coverage gate (90% line and branch)
        run: >
          dotnet test --project tests/NotepadNet.Core.Tests -c Release --no-build
          --results-directory TestResults/core --
          --coverlet --coverlet-include "[NotepadNet.Core]*" --coverlet-output-format cobertura
          --coverlet-threshold 90 --coverlet-threshold-type line,branch --coverlet-threshold-stat Total

      - name: Platform integration tests
        run: dotnet test --project tests/NotepadNet.Platform.Tests -c Release --no-build --results-directory TestResults/platform

      - name: App shell tests
        run: dotnet test --project tests/NotepadNet.App.Tests -c Release --no-build --results-directory TestResults/app

      # Hosted Windows runners have an interactive desktop session, which UI automation needs.
      - name: End-to-end tests (FlaUI on the built exe)
        run: dotnet test --project tests/NotepadNet.E2E.Tests -c Release --no-build --results-directory TestResults/e2e

      - name: Build the setup
        shell: pwsh
        run: |
          dotnet publish src/NotepadNet.App -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:Version=0.0.0 -o publish/win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./installer/Build-Installer.ps1 -Version 0.0.0 -Arch x64 -SourceDir publish/win-x64 -OutDir dist

      - name: Capture the wizard (temporary)
        continue-on-error: true
        shell: pwsh
        run: ./installer/Capture-Wizard.ps1 -Setup dist/Notepad.NET-0.0.0-setup-x64.exe -OutDir wizard

      - name: Upload the wizard pictures (temporary)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wizard
          path: wizard/*.png
          if-no-files-found: ignore

      - name: Install, upgrade and remove the setup
        shell: pwsh
        run: ./installer/Test-Installer.ps1 -Setup dist/Notepad.NET-0.0.0-setup-x64.exe

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: TestResults/**/*cobertura*.xml
          if-no-files-found: ignore
